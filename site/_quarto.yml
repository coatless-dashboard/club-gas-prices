project:
  type: website
  output-dir: ../_site

website:
  title: "Costco Gas Prices"
  description: "Posted fuel prices at Costco gas stations in seven countries."
  navbar:
    left:
      - href: index.qmd
        text: Map
      - href: compare.qmd
        text: Compare
      - href: trends.qmd
        text: Trends
      - href: station.qmd
        text: Station
      - href: about.qmd
        text: About
    right:
      # Two repositories: this site, and the collector whose releases it reads.
      - icon: github
        href: https://github.com/coatless-dashboard/club-gas-prices
        aria-label: "This site's source on GitHub"
      - icon: database
        href: https://github.com/coatless-datasets/club-gas-prices/releases/tag/current
        aria-label: "Download the data"

format:
  html:
    theme:
      light: [default, custom.scss]
      dark: [default, custom.scss, dark.scss]
    respect-user-color-scheme: true
    page-layout: custom
    toc: false
    css: []

execute:
  echo: false
