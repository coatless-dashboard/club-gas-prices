name: Render

on:
  # The data lives in another repository, and a GITHUB_TOKEN cannot start a
  # workflow across repositories, so this polls rather than being pushed to.
  # Reading a public repository's releases needs no token of its own, which is
  # the whole reason to poll instead of holding a PAT here.
  # Capture runs at :17 every six hours. This sits 33 minutes later so a render
  # never lands while `current` is being rewritten asset by asset, at the same
  # ~90 minute average freshness a :20 offset would give.
  schedule:
    - cron: "50 */3 * * *"
    # Once a week, off the three-hour grid: the tick the keepalive job answers.
    # The render runs on it too, the same as on any other scheduled tick.
    - cron: "50 1 * * 1"
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/render.yml
  workflow_dispatch:

concurrency:
  group: render
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DATA_REPO: coatless-data/club-gas-prices
  # The org-level Pages domain serves this repository under its own name.
  SITE_URL: https://dashboard.thecoatlessprofessor.com/club-gas-prices

jobs:
  render:
    name: Render
    # The smoke step drives this image's preinstalled Google Chrome, and falls
    # back to Playwright's own Chromium when Chrome is missing or will not
    # start. If a runner-image roll ever breaks the deploy gate, start looking
    # here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Fetch a consistent set of site data
        id: data
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! gh release view current --repo "$DATA_REPO" >/dev/null 2>&1; then
            echo "::notice::${DATA_REPO} has no current release yet, so there is nothing to render"
            echo "has_data=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            rm -rf site/data
            mkdir -p site/data
            ok=1
            gh release download current --repo "$DATA_REPO" --dir site/data --clobber \
              --pattern manifest.json \
              --pattern 'site-*.json' --pattern 'site-*.parquet' || ok=0
            if [ "$ok" = 1 ] && python3 .github/verify-site-data.py site/data; then
              echo "has_data=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::current was inconsistent on attempt ${attempt} of 5"
            sleep 60
          done
          echo "::error::${DATA_REPO} current never became consistent"
          exit 1

      # A scheduled run that would redeploy the data already on Pages is not
      # worth a render. A push or a manual run always renders, because there it
      # is the site source, not the data, that changed.
      - name: Decide whether to render
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ steps.data.outputs.has_data }}" != "true" ]; then
            echo "render=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The whole of meta.json, not only its capture_id. A Rebuild rewrites
          # the site assets under the capture they already had, and only
          # built_at_utc changes to say so. Compared on the capture alone, its
          # corrections stayed off the site until the next capture landed.
          # Pages serves the file byte for byte as it was staged.
          built="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["capture_id"] or "")' site/data/meta.json)"
          live="${RUNNER_TEMP}/live-meta.json"
          if curl -fsSL --max-time 30 -o "$live" "${SITE_URL}/data/meta.json" \
            && cmp -s site/data/meta.json "$live"; then
            echo "::notice::this build of capture ${built} is already deployed"
            echo "render=false" >> "$GITHUB_OUTPUT"
          else
            echo "render=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Quarto
        if: ${{ steps.plan.outputs.render == 'true' }}
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.10.18

      - name: Render the site
        if: ${{ steps.plan.outputs.render == 'true' }}
        run: quarto render site

      - name: Stage _site
        if: ${{ steps.plan.outputs.render == 'true' }}
        run: |
          set -euo pipefail
          # The project writes straight into _site, so staging is only the data
          # the pages fetch at runtime plus the leak check. Quarto has already
          # copied the files the pages name, so _site/data exists by now, and
          # `cp -R` into it nested a second copy of everything at data/data.
          # Replacing it leaves exactly the verified download.
          rm -rf _site/data
          cp -R site/data _site/data
          leaked="$(find _site \( -name '*.qmd' -o -name '*.scss' \) -print)"
          if [ -n "$leaked" ]; then
            echo "::error::source files reached _site"
            printf '%s\n' "$leaked"
            exit 1
          fi

      - name: Set up uv
        if: ${{ steps.plan.outputs.render == 'true' }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Smoke test the rendered site
        if: ${{ steps.plan.outputs.render == 'true' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          uv sync --locked --group smoke
          uv run python tests/smoke/smoke_site.py _site

      - name: Upload the Pages artifact
        if: ${{ steps.plan.outputs.render == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        if: ${{ steps.plan.outputs.render == 'true' }}
        uses: actions/deploy-pages@v5

  # GitHub turns off a public repository's scheduled workflows after 60 days
  # without repository activity, and nothing here makes any: the render reads
  # another repository and deploys to Pages, and never commits. So once a week
  # this re-enables its own workflow through the API, which is the approach the
  # widely used keepalive actions (liskin/gh-workflow-keepalive among them)
  # take instead of pushing empty commits. GitHub does not document the enable
  # call as resetting the 60-day timer, only as setting the workflow active, so
  # this is the common practice rather than a guarantee.
  keepalive:
    name: Keep the schedule on
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '50 1 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one write this workflow needs outside Pages, so it is granted to this
    # job alone and replaces the workflow's permissions here rather than adding
    # to them.
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Re-enable this workflow
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/render.yml/enable
